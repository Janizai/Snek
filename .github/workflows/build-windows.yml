name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # pick a version you used locally

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: |
          # --onefile makes a single exe.
          # --windowed prevents console; remove if you want console.
          # Add data: "src/coin.png;src" (semicolon required on Windows)
          pyinstaller --onefile --windowed --add-data "src/coin.png;src" snake.py

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-windows-exe
          path: dist/*.exe
